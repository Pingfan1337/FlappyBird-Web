<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4ec0ca" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Flappy Bird 1.2 Web Port — 60Hz exact original physics with high-refresh WebGL2 interpolation, full keyboard, mouse, trackpad, and touch support." />
  <title>Flappy Bird · Web</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    #safe-probe {
      position: fixed; inset: 0; pointer-events: none; visibility: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #game {
      display: block; width: 100%; height: 100%;
      touch-action: none;
    }
    .hud-top {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; z-index: 10;
    }
    .hud-actions { display: flex; gap: 8px; pointer-events: auto; }
    .hud-btn {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.54);
      color: #fff; display: grid; place-items: center;
      cursor: pointer; padding: 0; transition: transform 0.08s ease, background 0.15s ease;
    }
    .hud-btn:hover { background: rgba(15, 23, 42, 0.72); }
    .hud-btn:active { transform: scale(0.92); }
    .hud-btn[hidden] { display: none; }
    .hud-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #btn-mute[data-muted="1"] .icon-sound-on,
    #btn-mute[data-muted="0"] .icon-sound-off { display: none; }
    #btn-fps[data-active="1"] { border-color: rgba(255, 255, 255, 0.48); background: rgba(15, 23, 42, 0.72); }

    #fps-badge {
      pointer-events: auto; cursor: pointer;
      contain: strict;
      transform: translateZ(0);
      width: 150px; height: 24px; line-height: 24px;
      text-align: center; white-space: nowrap;
      font: 500 11px/24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
      background: rgba(15, 23, 42, 0.44);
      padding: 0 8px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    #fps-badge[hidden] { display: none; }

    #hint-bar {
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      padding: 5px 12px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.92);
      font-size: 12px; white-space: nowrap;
      pointer-events: none; z-index: 9;
      transition: opacity 0.4s ease;
    }
    #hint-bar.fade-out { opacity: 0; }
    @media (hover: none) and (pointer: coarse) {
      #hint-bar { display: none; }
    }

    .overlay {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center;
      background: rgba(10, 14, 24, 0.56);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 20px;
    }
    .overlay[hidden] { display: none; }
    .card {
      width: min(340px, 100%);
      background: rgba(23, 28, 40, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px; padding: 20px;
      color: #f8fafc; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
    .card p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: #cbd5e1; }
    .card a { color: #38bdf8; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .card code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(255, 255, 255, 0.1); padding: 1px 5px; border-radius: 4px; font-size: 12px;
    }
    .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .action-btn {
      width: 100%; padding: 11px 16px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .action-btn.primary { background: #22c55e; border-color: #16a34a; color: #052e16; }
    .action-btn:hover { filter: brightness(1.08); }
    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .stat-grid > div {
      background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-grid span { font-size: 11.5px; color: #94a3b8; }
    .stat-grid strong { font-size: 16px; color: #f8fafc; }
    .controls-list { margin: 0 0 12px; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
    .modal-note { font-size: 12px !important; color: #94a3b8 !important; }
  </style>
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>
  <canvas id="game" aria-label="Flappy Bird"></canvas>

  <div class="hud-top">
    <div class="hud-actions">
      <button id="btn-pause" class="hud-btn" type="button" hidden aria-label="暂停 (P)" title="暂停 (P)">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="btn-mute" class="hud-btn" type="button" data-muted="0" aria-label="静音 (M)" title="静音 (M)">
        <svg class="icon-sound-on" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>
      <button id="btn-fps" class="hud-btn" type="button" data-active="1" aria-label="帧率信息 (F)" title="帧率信息 (F)">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
      </button>
    </div>
    <div id="fps-badge" title="点击或按 F 隐藏">-- FPS | P99 -- ms</div>
  </div>

  <div id="hint-bar">Space / ↑ / W / 点击振翅 · P 暂停 · M 静音 · F 帧率 · R 重开</div>

  <div id="pause-overlay" class="overlay" hidden>
    <div class="card">
      <h2>游戏已暂停</h2>
      <div class="btn-stack">
        <button id="btn-resume" class="action-btn primary" type="button">继续飞行 (Space / P)</button>
        <button id="btn-restart" class="action-btn" type="button">重新开始 (R)</button>
        <button id="btn-menu" class="action-btn" type="button">返回主菜单</button>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="btn-stack">
        <button id="modal-close" class="action-btn primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
